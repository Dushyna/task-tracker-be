version: '3.8'
name: task-tracker-backend

services:
  mysql:
    image: mysql:8.0.36
    container_name: mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: task_tracker
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--lower-case-table-names=2"
      ]
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../initdb:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: task-tracker-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql-local
      - DB_PORT=3306
      - DB_NAME=task_tracker
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - UPLOAD_DIR=uploads/attachments
      - JWT_AT_SECRET=${JWT_AT_SECRET}
      - JWT_RT_SECRET=${JWT_RT_SECRET}
      - JWT_AT_LIVE_IN_MIN=15
      - JWT_RT_LIVE_IN_MIN=10080
      - BASE_URL=${BASE_URL}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net
volumes:
  mysql_data:
    name: mysql_data
  task_uploads_storage:
    name: task_uploads_storage

networks:
  app_net:
    name: mysql_network
    external: true