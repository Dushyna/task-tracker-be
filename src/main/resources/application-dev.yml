server:
  port: ${PORT:8080}
spring:
  application:
    name: Task Tracker
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:task_tracker}?rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  mail:
    username: ${EMAIL_USERNAME:fake}
    password: ${EMAIL_PASSWORD:fake}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        #        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            protocols: TLSv1.2
            trust: smtp.gmail.com

logging:
  level:
    #    root: debug
    org.hibernate.SQL: DEBUG

confirmation:
  expiration:
    days: ${CONFIRMATION_EXPIRATION_DAYS:5}

app:
  base-url: ${BASE_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads/attachments}

#1 day = 1440min
#7 day = 10080min
jwt:
  at:
    live-in-min: ${JWT_AT_LIVE_IN_MIN:10}
    secret: ${JWT_AT_SECRET:local_dev_secret_key_must_be_very_long_32_characters_minimum}
  rt:
    live-in-min: ${JWT_RT_LIVE_IN_MIN:1440}
    secret: ${JWT_RT_SECRET:local_dev_secret_key_must_be_very_long_32_characters_minimum}

springdoc:
  swagger-ui:
    with-credentials: true
